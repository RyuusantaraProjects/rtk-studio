<!-- Interactive AI Assistant Modal ("Jendela AI Connector") -->
<template x-teleport="body">
    <div x-show="showAiModal" x-cloak
         class="fixed inset-0 z-[130] flex items-center justify-center p-4"
         style="background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px);"
         @click.self="closeAiModal()"
         @keydown.escape.window="closeAiModal()">

        <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-xl overflow-hidden border border-stone-100 flex flex-col h-[600px] max-h-[90vh]"
             @click.stop
             x-show="showAiModal"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 scale-100"
             x-transition:leave-end="opacity-0 scale-95">

            <!-- Modal Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-stone-100 bg-gradient-to-r from-emerald-500/10 via-emerald-50/40 to-white">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center shadow-xs">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h3 class="text-base font-bold text-stone-900 leading-none">ChatGPT Content Assistant</h3>
                            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800">Connector</span>
                        </div>
                        <p class="text-xs text-stone-500 mt-0.5">Generate ide dan buat caption langsung untuk scheduler</p>
                    </div>
                </div>
                <button type="button" @click="closeAiModal()"
                        class="w-8 h-8 rounded-full flex items-center justify-center text-stone-400 hover:text-stone-700 hover:bg-stone-100 transition-colors cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <!-- Chat Message History -->
            <div class="flex-1 overflow-y-auto p-5 space-y-4 bg-stone-50/40" id="ai-messages-container">
                <!-- Welcome Bot Message -->
                <div class="flex items-start gap-3">
                    <div class="w-7 h-7 rounded-lg bg-emerald-600 text-white flex items-center justify-center text-xs font-bold shrink-0">
                        AI
                    </div>
                    <div class="p-3.5 rounded-2xl bg-white border border-stone-200 shadow-xs text-xs text-stone-800 leading-relaxed max-w-[85%] space-y-2">
                        <p>Halo! Saya asisten konten ChatGPT untuk Brightbean Studio. Apa yang ingin Anda buat hari ini?</p>
                        <div class="flex flex-wrap gap-1.5 pt-1">
                            <button type="button" @click="sendQuickPrompt('Buatkan caption promo diskon 20% kopi untuk Instagram besok siang')"
                                    class="px-2.5 py-1 rounded-full bg-stone-100 hover:bg-emerald-50 hover:text-emerald-700 border border-stone-200 text-[11px] font-medium transition-colors text-left">
                                ☕ Promo diskon kopi besok siang
                            </button>
                            <button type="button" @click="sendQuickPrompt('Buatkan tips produktivitas kerja untuk postingan LinkedIn')"
                                    class="px-2.5 py-1 rounded-full bg-stone-100 hover:bg-emerald-50 hover:text-emerald-700 border border-stone-200 text-[11px] font-medium transition-colors text-left">
                                💼 Tips produktivitas LinkedIn
                            </button>
                            <button type="button" @click="sendQuickPrompt('Buatkan ucapan selamat akhir pekan santai untuk Twitter/X')"
                                    class="px-2.5 py-1 rounded-full bg-stone-100 hover:bg-emerald-50 hover:text-emerald-700 border border-stone-200 text-[11px] font-medium transition-colors text-left">
                                🌴 Ucapan weekend Twitter
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Messages loop -->
                <template x-for="(msg, i) in aiChatMessages" :key="i">
                    <div class="flex items-start gap-3" :class="msg.role === 'user' ? 'justify-end' : ''">
                        <template x-if="msg.role === 'assistant'">
                            <div class="w-7 h-7 rounded-lg bg-emerald-600 text-white flex items-center justify-center text-xs font-bold shrink-0">
                                AI
                            </div>
                        </template>
                        <div class="p-3.5 rounded-2xl shadow-xs text-xs leading-relaxed max-w-[85%]"
                             :class="msg.role === 'user' ? 'bg-orange-500 text-white' : 'bg-white border border-stone-200 text-stone-800'">
                            <p class="whitespace-pre-line" x-text="msg.content"></p>
                            <template x-if="msg.role === 'assistant' && msg.caption">
                                <div class="mt-3 pt-2.5 border-t border-stone-100 flex items-center gap-2">
                                    <button type="button" @click="useInScheduler(msg.caption)"
                                            class="px-3 py-1.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-semibold text-[11px] shadow-xs flex items-center gap-1.5 transition-colors cursor-pointer">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
                                        Gunakan di Scheduler &rarr;
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <div x-show="aiGenerating" class="flex items-center gap-2 text-xs text-stone-400 pl-10">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-bounce"></span>
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-bounce" style="animation-delay: 0.2s"></span>
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-bounce" style="animation-delay: 0.4s"></span>
                    <span>ChatGPT sedang menulis...</span>
                </div>
            </div>

            <!-- Input Box -->
            <div class="p-4 border-t border-stone-100 bg-white">
                <form @submit.prevent="sendAiMessage()" class="flex items-center gap-2">
                    <input type="text" x-model="aiUserInput"
                           placeholder="Ketik permintaan konten (contoh: buatkan postingan tips...)"
                           class="flex-1 px-4 py-2.5 text-sm bg-stone-50 border border-stone-200 rounded-2xl outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition-all">
                    <button type="submit"
                            :disabled="!aiUserInput.trim() || aiGenerating"
                            class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-semibold text-xs transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                        Kirim
                    </button>
                </form>
            </div>
        </div>
    </div>
</template>
